name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run check:dist

  # The same four stages harness-compat.yml runs on its schedule — types
  # (with the bundle's seed reads), tests, peer admission and a real boot of
  # the packed plugin — against the pinned train and the floor. These two gate
  # a merge: in branch protection, require `node 22.19`, `node 24`,
  # `harness / harness@pinned` and `harness / harness@floor`.
  #
  # `issues: write` is requested by the called workflow's verdict step and is
  # never used here (`report` stays false); a caller cannot grant a called
  # workflow less than it declares. A fork's pull_request token is read-only
  # regardless.
  harness:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/harness-compat.yml
    with:
      cells: pinned,floor

  # What the desktop app ships today, resolved from its update feeds, and the
  # npm Web app at that exact version. Visible on every PR but deliberately not
  # a required check: the feed moves under open PRs, and the scheduled run
  # owns that signal.
  desktop:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/harness-compat.yml
    with:
      cells: desktop
