# Cut a release from a tag.
#
# Nothing is attached until `gate` passes: the tag's own tree must install,
# activate, answer on its routes and be served on its pinned train, on the
# floor, and on the version the desktop app ships today (as the npm Web app
# and as the desktop zip itself), and must typecheck, test and be admitted on
# every published harness version the sweep finds.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
# Read-only by default: only the job that creates the release may write, and
# no secret or token is set above the one step that uses it. The tag reaches
# shell steps only as $RELEASE_TAG, never interpolated into a script.
permissions:
  contents: read
jobs:
  gate:
    # `issues: write` is declared by the called workflow; `report` is off, so
    # a release run never files issues.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/harness-compat.yml
    with:
      cells: pinned,floor,desktop,sweep
      smoke: none
      desktop-bytes: true
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify tag and all release gates
        run: |
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + p.version) process.exit(1)'
          npm run typecheck
          npm test
          npm run build
          npm run check
          npm run check:dist
      - name: Pack stable asset and checksum
        run: |
          ASSET=$(npm pack --ignore-scripts --silent)
          mv "$ASSET" dsh-drop.tgz
          sha256sum dsh-drop.tgz > SHA256SUMS

      # The exact harness versions the gate verified, prepended to the
      # generated notes and written to this run's summary.
      - name: Collect what the gate verified
        uses: actions/download-artifact@v4
        with:
          pattern: harness-*
          path: ${{ runner.temp }}/verified

      - name: Compatibility note
        run: |
          node - "$RUNNER_TEMP/verified" > "$RUNNER_TEMP/notes.md" <<'JS'
          const { existsSync, readdirSync, readFileSync } = require('node:fs')
          const dir = process.argv[2]
          const rows = (existsSync(dir) ? readdirSync(dir) : []).sort().flatMap((cell) => {
            const file = `${dir}/${cell}/smoke.jsonl`
            if (!existsSync(file)) return []
            return readFileSync(file, 'utf8').trim().split('\n').filter(Boolean).map((line) => [cell.replace(/^harness-/, ''), JSON.parse(line)])
          })
          console.log('### Verified harness versions\n')
          console.log('Boot smoke of this release\'s tarball: installed with `dsh plugin add` (no exemption), activated, its Host routes answered, and its browser half served.\n')
          console.log('| cell | dsh | smoke |\n| --- | --- | --- |')
          for (const [cell, r] of rows) console.log(`| ${cell} | ${r.dsh ?? '?'} | ${r.outcome} |`)
          console.log('\nEvery published harness version the gate swept either passed typecheck, tests and peer admission or is published incomplete upstream; the gate run lists each one.')
          JS
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dsh-drop.tgz SHA256SUMS --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --title "DSH Drop $RELEASE_TAG"
