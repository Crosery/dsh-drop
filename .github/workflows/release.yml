# Cut a release from a tag.
#
# `pack` builds the one tarball this release ships, once, from the tag's tree,
# after every local gate — with the committed lib/ checked against a scratch
# build before anything rebuilds it in place. Nothing is attached until `gate`
# passes: that very tarball must install, activate, answer on its routes and
# be served on its pinned train, on the floor, on the version the desktop app
# ships today (as the npm Web app and as the desktop zip itself) and on every
# published harness version the sweep finds, where the tag's tree must also
# typecheck, test and be admitted — a version whose @deepseek-ai/dsh cannot be
# installed at all is reported incomplete instead. `release` then attaches the
# same file, and refuses to if any smoke the gate recorded installed different
# bytes.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
# Read-only by default: only the job that creates the release may write, and
# no secret or token is set above the one step that uses it. The tag reaches
# shell steps only as $RELEASE_TAG, never interpolated into a script.
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify tag and all local gates
        run: |
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + p.version) { console.error("::error::tag " + process.env.RELEASE_TAG + " is not v" + p.version); process.exit(1) }'
          npm run typecheck
          npm test
          # The committed lib/ against a scratch build, before the build below
          # rewrites lib/ in place and makes a stale commit look current.
          npm run check:dist
          npm run build
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::npm run build changed the tag's tree; the tag does not ship what its source builds"
            exit 1
          fi
          npm run check
      - name: Pack stable asset and checksum
        run: |
          ASSET=$(npm pack --ignore-scripts --silent)
          mv "$ASSET" dsh-drop.tgz
          sha256sum dsh-drop.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-asset
          path: |
            dsh-drop.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: pack
    # `issues: write` and `actions: read` are declared by the called workflow;
    # `report` is off, so a release run never files issues.
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/harness-compat.yml
    with:
      cells: pinned,floor,desktop,sweep
      smoke: all
      desktop-bytes: true
      ref: ${{ inputs.tag || github.ref }}
      tarball: release-asset

  release:
    needs: [pack, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Collect the asset the gate smoked
        uses: actions/download-artifact@v4
        with:
          name: release-asset
          path: ${{ runner.temp }}/asset

      # The exact harness versions the gate verified, prepended to the
      # generated notes and written to this run's summary.
      - name: Collect what the gate verified
        uses: actions/download-artifact@v4
        with:
          pattern: harness-*
          path: ${{ runner.temp }}/verified

      - name: Compatibility note, bound to the asset's bytes
        working-directory: ${{ runner.temp }}/asset
        run: |
          sha256sum -c SHA256SUMS
          node - "$RUNNER_TEMP/verified" "$(sha256sum dsh-drop.tgz | cut -d' ' -f1)" > "$RUNNER_TEMP/notes.md" <<'JS'
          const { existsSync, readdirSync, readFileSync } = require('node:fs')
          const [dir, asset] = process.argv.slice(2)
          const rows = (existsSync(dir) ? readdirSync(dir) : []).sort().flatMap((cell) => {
            const file = `${dir}/${cell}/smoke.jsonl`
            if (!existsSync(file)) return []
            return readFileSync(file, 'utf8').trim().split('\n').filter(Boolean).map((line) => [cell.replace(/^harness-/, ''), JSON.parse(line)])
          })
          // The notes claim the smoke covered this asset; hold every row to it.
          if (rows.length === 0) throw new Error('the gate left no boot-smoke record')
          for (const [cell, r] of rows) {
            if (r.sha256 !== asset) throw new Error(`harness@${cell} smoked a tarball with sha256 ${r.sha256}, not the asset's ${asset}`)
            if (r.outcome !== 'passed') throw new Error(`harness@${cell} smoke ${r.outcome}`)
          }
          console.log('### Verified harness versions\n')
          console.log(`Boot smoke of this release's tarball (sha256 \`${asset}\`): installed with \`dsh plugin add\` (no exemption), activated, its Host routes answered, and its browser half served.\n`)
          console.log('| cell | dsh | smoke |\n| --- | --- | --- |')
          for (const [cell, r] of rows) console.log(`| ${cell} | ${r.dsh ?? '?'} | ${r.outcome} |`)
          console.log('\nEvery published harness version the gate swept either passed typecheck, tests, peer admission and this boot smoke or is published incomplete upstream (its @deepseek-ai/dsh does not install); the gate run lists each one.')
          JS
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified release
        working-directory: ${{ runner.temp }}/asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" dsh-drop.tgz SHA256SUMS --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --title "DSH Drop $RELEASE_TAG"
