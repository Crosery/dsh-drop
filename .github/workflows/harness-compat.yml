# Does this plugin still work on the harness people actually run?
#
# One question per cell, four stages per cell:
#
#   types      all three typechecks (Host, client, tests) against that train's
#              published .d.ts, and the client bundle against that train's own
#              shell: only specifiers its dsh-web-frontend module table answers,
#              and only seed members its packages export (check-dist.mjs
#              --bundle-only --train <version>)
#   tests      the plugin's own tests against that train's packages
#   admission  the peer ranges admit the version under BOTH semver rules — the
#              prerelease-inclusive one dsh >= 0.1.7 applies at install and at
#              boot (it refuses or silently skips a plugin that fails it), and
#              the default one npm and pnpm apply
#   smoke      scripts/smoke-boot.mjs: the packed plugin installs through the
#              official `dsh plugin add`, activates, answers on its three Host
#              routes (behind the harness's login check where it has one), and
#              its browser half is served and evaluates against the shell's
#              module table and the train's real exports
#
# v0.1.3 passed types and tests on the 0.1.6 trains and was still absent from
# the 0.1.7 desktop app: admission refused it, and its rail read four icons
# 0.1.7 renamed. That is why all four exist.
#
# Cells (scripts/harness-target.mjs resolves each one to an exact version):
#
#   pinned              the devDependencies pin          gates PRs and releases
#   floor               0.1.1-rc.2                       gates PRs and releases
#   desktop             what the desktop app ships now,  on PRs (not required),
#                       read from both update feeds       daily, gates releases
#   latest|next|alpha   npm dist-tags                    daily
#   sweep               every published version, from    weekly; all four stages
#                       the lowest the peers admit        on every row gate releases
#                       (0.0.1-rc.1 on)
#   desktop-bytes       the same smoke on the desktop    daily, gates releases
#                       zip itself (macOS job below)
#
# Sweep rows boot the plugin on every version (`smoke: all`, the default) —
# the plugin is installed into each published harness and run there; `heads`
# (the newest build of each tuple and what the named cells resolve to) and
# `none` remain for a dispatch. Matrix jobs run in parallel, so the sweep's
# wall time is roughly its slowest cell, not the sum.
#
# A train whose @deepseek-ai/dsh does not install on its own (0.0.1-rc.1 and
# rc.2: npm answers E404 for dsh-agent-tool-mode) — or not published on npm
# yet — is "incomplete": neutral, it neither opens nor closes an issue, and the
# step summary quotes npm's answer. Only npm's answers about the packages count
# (E404, ETARGET, ERESOLVE); a registry that does not answer fails the cell,
# and pinned and floor are never incomplete. Admission needs no install, so it
# runs on an incomplete train too.
#
# Scheduled and dispatched runs report: a failing cell opens or comments on
# the `upstream-drift` issue "Harness compatibility broken against @<cell>",
# and a cell whose every stage passes comments on that issue and closes it.
# Every way a cell can go wrong reaches its verdict: each step has its own
# timeout, and the job's is their sum plus margin, so a hung step fails as
# itself instead of the job being cancelled around it; a stage cut off while
# the run goes on counts as failed (a run someone cancelled reports nothing);
# and a step outside the stages (checkout, Node, npm ci, the cache, the
# artifact upload) fails the cell as `job`. What still gets past a verdict —
# a checkout that failed before the verdict script existed, a verdict that
# failed, a job that ran out of time, a plan that never produced cells — the
# `unreported` job files from the run's own job list.
name: Harness compatibility

on:
  schedule:
    - cron: '17 5 * * *'   # daily: desktop, latest, next, alpha, desktop-bytes
    - cron: '43 6 * * 1'   # weekly: the full sweep, desktop-bytes
  workflow_dispatch:
    inputs:
      cells:
        description: 'Comma-separated: pinned, floor, desktop, latest, next, alpha, sweep, or exact versions'
        default: 'desktop,latest,next,alpha'
        type: string
      smoke:
        description: 'Boot smoke for sweep rows'
        default: all
        type: choice
        options: [all, heads, none]
      desktop-bytes:
        description: 'Also smoke the desktop zip on macOS'
        default: true
        type: boolean
      report:
        description: 'Open, comment on and close upstream-drift issues'
        default: true
        type: boolean
  workflow_call:
    inputs:
      cells:
        type: string
        default: 'pinned,floor'
      smoke:
        type: string
        default: all
      desktop-bytes:
        type: boolean
        default: false
      report:
        type: boolean
        default: false
      ref:
        description: 'Ref to test; the caller''s ref when empty'
        type: string
        default: ''
      tarball:
        description: 'An artifact of this run holding dsh-drop.tgz: every smoke installs that file instead of packing the checkout, so a release smokes the very file it ships'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm

      # The resolver needs semver; the lockfile provides it.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10

      - name: Plan the cells
        id: plan
        timeout-minutes: 10
        env:
          CELLS: ${{ inputs.cells || (github.event.schedule == '43 6 * * 1' && 'sweep') || 'desktop,latest,next,alpha' }}
          SMOKE: ${{ inputs.smoke || 'all' }}
        run: node scripts/harness-target.mjs --plan "$CELLS" --smoke "$SMOKE"

  against:
    needs: plan
    name: harness@${{ matrix.cell }}
    runs-on: ubuntu-latest
    # The sum of the step timeouts below (130), plus margin for the post steps.
    timeout-minutes: 145
    # Only the verdict writes issues, and only when reporting. A caller must
    # grant this too: a called workflow cannot hold more than its caller gives.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10

      # Exit 3 is an incomplete train: the step passes, `incomplete` is set,
      # and every later stage but admission stands down.
      - name: Resolve ${{ matrix.cell }}
        id: target
        timeout-minutes: 10
        run: |
          set +e
          node scripts/harness-target.mjs "$CELL" --repoint
          status=$?
          if [ "$status" = 3 ]; then exit 0; fi
          exit "$status"

      # The resolved graph, installed the way the train runs: peers included,
      # and only on ERESOLVE in legacy peer mode with the train's own harness
      # peers pinned. Exit 3 when `@deepseek-ai/dsh` itself does not install.
      - name: Install that train
        id: install
        if: steps.target.outputs.incomplete != 'true'
        timeout-minutes: 25
        env:
          TARGET: ${{ matrix.cell == 'pinned' && 'pinned' || steps.target.outputs.version }}
        run: |
          set +e
          node scripts/harness-target.mjs "$TARGET" --install
          status=$?
          if [ "$status" = 3 ]; then exit 0; fi
          exit "$status"

      - name: Typecheck (Host, client, tests) and the bundle's seed reads
        id: types
        if: steps.target.outputs.incomplete != 'true' && steps.install.outputs.incomplete != 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          npm run typecheck
          node scripts/check-dist.mjs --bundle-only --train "$VERSION"

      - name: Test
        id: tests
        if: steps.target.outputs.incomplete != 'true' && steps.install.outputs.incomplete != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: npm test

      # Pure semver over the resolved version: it runs whenever there is one,
      # installed or not — a new tuple the ranges refuse is drift even while
      # npm still lacks its packages.
      - name: Peer admission
        id: admission
        if: ${{ !cancelled() && steps.target.outputs.version != '' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: node scripts/harness-target.mjs "$VERSION" --admits

      - name: Fetch the tarball under test
        if: inputs.tarball != '' && matrix.smoke && steps.target.outputs.incomplete != 'true' && steps.install.outputs.incomplete != 'true'
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tarball }}
          path: ${{ runner.temp }}/under-test

      - name: Boot smoke
        id: smoke
        if: matrix.smoke && steps.target.outputs.incomplete != 'true' && steps.install.outputs.incomplete != 'true'
        continue-on-error: true
        timeout-minutes: 30
        env:
          VERSION: ${{ steps.target.outputs.version }}
          TARBALL: ${{ inputs.tarball != '' && format('{0}/under-test/dsh-drop.tgz', runner.temp) || '' }}
          SMOKE_RESULT: ${{ runner.temp }}/smoke.jsonl
        run: |
          # Never pack a repointed manifest: the smoke installs what a user gets.
          git checkout -- package.json package-lock.json
          args=(--dsh "$VERSION")
          if [ -n "$TARBALL" ]; then args+=(--tarball "$TARBALL"); fi
          node scripts/smoke-boot.mjs "${args[@]}"

      - if: always() && steps.target.outputs.version != ''
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.cell }}
          path: ${{ runner.temp }}/smoke.jsonl
          if-no-files-found: ignore
          retention-days: 30

      # Not when someone cancelled the run: a stage cut off otherwise is a failure.
      - name: Verdict
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.target.outputs.version }}
          INCOMPLETE: ${{ steps.target.outputs.incomplete == 'true' || steps.install.outputs.incomplete == 'true' }}
          EXPECTED: ${{ matrix.smoke && 'types,tests,admission,smoke' || 'types,tests,admission' }}
          REPORT: ${{ github.event_name == 'schedule' || inputs.report }}
          JOB_STATUS: ${{ job.status }}
          STAGE_resolve: ${{ steps.target.outcome }}
          STAGE_install: ${{ steps.install.outcome }}
          STAGE_types: ${{ steps.types.outcome }}
          STAGE_tests: ${{ steps.tests.outcome }}
          STAGE_admission: ${{ steps.admission.outcome }}
          STAGE_smoke: ${{ steps.smoke.outcome }}
        with:
          script: await require('./scripts/harness-verdict.cjs')({ github, context, core })

  # The same smoke on the desktop app's own bytes: its Electron Node, the exact
  # runtime package set inside app.asar and its bundled pnpm. mac-arm64 is the
  # only mac feed that exists, and macos-latest is arm64.
  #
  # Not covered here or anywhere in CI: the Electron renderer, the preload
  # bridge (`__DSH_HOST_PATHS__`, which gives dropped files and folders their
  # real paths) and native drag-and-drop. Those need the GUI.
  desktop-bytes:
    if: github.event_name == 'schedule' || inputs.desktop-bytes
    name: harness@desktop-bytes
    runs-on: macos-latest
    # The sum of the step timeouts below (115), plus margin for the cache's post step.
    timeout-minutes: 130
    permissions:
      contents: read
      issues: write
    env:
      CELL: desktop-bytes
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10

      - name: Read the mac-arm64 feed
        id: feed
        timeout-minutes: 5
        run: node scripts/harness-target.mjs --feed mac-arm64

      - uses: actions/cache@v4
        id: app
        timeout-minutes: 15
        with:
          path: ~/dsh-desktop
          # hashFiles() only sees the workspace; the feed's digest names the build exactly.
          key: dsh-desktop-mac-arm64-${{ steps.feed.outputs.version }}-${{ steps.feed.outputs.sha512 }}

      - name: Download and verify the shipped zip
        id: download
        if: steps.app.outputs.cache-hit != 'true'
        timeout-minutes: 25
        env:
          URL: ${{ steps.feed.outputs.path }}
          SHA512: ${{ steps.feed.outputs.sha512 }}
        run: |
          curl -fL --retry 3 --retry-delay 10 "$URL" -o "$RUNNER_TEMP/app.zip"
          actual="$(openssl dgst -sha512 -binary "$RUNNER_TEMP/app.zip" | base64)"
          if [ "$actual" != "$SHA512" ]; then echo "::error::sha512 mismatch: the zip is not the build the feed announces"; exit 1; fi
          mkdir -p ~/dsh-desktop
          ditto -x -k "$RUNNER_TEMP/app.zip" ~/dsh-desktop
          rm "$RUNNER_TEMP/app.zip"

      - name: Cross-check the bundled runtime against the feed
        id: runtime
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.feed.outputs.version }}
        run: |
          APP="$(find ~/dsh-desktop -maxdepth 2 -name '*.app' -print -quit)"
          EXE="$APP/Contents/MacOS/$(defaults read "$APP/Contents/Info" CFBundleExecutable)"
          RES="$APP/Contents/Resources"
          {
            echo "exe=$EXE"
            echo "harness=$RES/app.asar/dsh"
            echo "pnpm=$RES/runtime/pnpm/bin/pnpm.mjs"
          } >> "$GITHUB_OUTPUT"
          # desktop-runtime.json is what the app reports as its bundled dsh.
          ELECTRON_RUN_AS_NODE=1 "$EXE" -e '
            const [dir, feed] = process.argv.slice(1)
            const r = JSON.parse(require("fs").readFileSync(dir + "/desktop-runtime.json", "utf8"))
            const dsh = JSON.parse(require("fs").readFileSync(dir + "/node_modules/@deepseek-ai/dsh/package.json", "utf8")).version
            console.log(JSON.stringify({ feed, release: r.release, dsh }))
            if (r.release.version !== feed || dsh !== feed) { console.error("::error::the app bundles " + dsh + " (" + r.release.version + ") but its feed announces " + feed); process.exit(1) }
          ' "$RES/app.asar/dsh" "$VERSION"

      - name: Fetch the tarball under test
        if: inputs.tarball != ''
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tarball }}
          path: ${{ runner.temp }}/under-test

      - name: Boot smoke on the desktop runtime
        id: smoke
        continue-on-error: true
        timeout-minutes: 30
        env:
          EXE: ${{ steps.runtime.outputs.exe }}
          HARNESS: ${{ steps.runtime.outputs.harness }}
          PNPM_MJS: ${{ steps.runtime.outputs.pnpm }}
          TARBALL: ${{ inputs.tarball != '' && format('{0}/under-test/dsh-drop.tgz', runner.temp) || '' }}
          SMOKE_RESULT: ${{ runner.temp }}/smoke.jsonl
        run: |
          # `dsh plugin` runs whatever pnpm is on PATH: make that the app's own.
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nELECTRON_RUN_AS_NODE=1 exec "%s" "%s" "$@"\n' "$EXE" "$PNPM_MJS" > "$RUNNER_TEMP/bin/pnpm"
          chmod +x "$RUNNER_TEMP/bin/pnpm"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          args=(--harness-dir "$HARNESS")
          if [ -n "$TARBALL" ]; then args+=(--tarball "$TARBALL"); fi
          ELECTRON_RUN_AS_NODE=1 "$EXE" scripts/smoke-boot.mjs "${args[@]}"

      - if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: harness-desktop-bytes
          path: ${{ runner.temp }}/smoke.jsonl
          if-no-files-found: ignore
          retention-days: 30

      # Not when someone cancelled the run: a stage cut off otherwise is a failure.
      - name: Verdict
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.feed.outputs.version }}
          INCOMPLETE: 'false'
          EXPECTED: feed,runtime,smoke
          REPORT: ${{ github.event_name == 'schedule' || inputs.report }}
          JOB_STATUS: ${{ job.status }}
          STAGE_feed: ${{ steps.feed.outcome }}
          STAGE_download: ${{ steps.download.outcome }}
          STAGE_runtime: ${{ steps.runtime.outcome }}
          STAGE_smoke: ${{ steps.smoke.outcome }}
        with:
          script: await require('./scripts/harness-verdict.cjs')({ github, context, core })

  # The catch-all on reporting runs. It reads this run's job list (hence
  # `actions: read`) and files every plan or cell job that failed or was
  # cancelled while its issue does not mention this run: the job's checkout
  # failed before its verdict script existed, the verdict itself failed, the
  # job ran out of time, or the plan never produced cells. A verdict that did
  # file its cell is left alone, and a plan that works again closes the plan
  # issue. Its own checkout (the scripts only) is independent of every job it
  # judges.
  unreported:
    needs: [plan, against, desktop-bytes]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.report) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: File what no verdict reported
        timeout-minutes: 5
        uses: actions/github-script@v7
        with:
          script: await require('./scripts/harness-verdict.cjs').unreported({ github, context, core })
